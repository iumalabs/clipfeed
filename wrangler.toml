name = "clipfeed"
main = "dist/api/index.js"
compatibility_date = "2026-07-01"

# Disables the default *.workers.dev route once a custom domain is attached
# (dashboard-side — see README "Deploy your own (fork)"; this repo never
# hardcodes a fork's actual domain). Not a security boundary by itself — the
# Access-JWT middleware in access-middleware.ts already fails closed on every
# /api/admin/* route regardless of which hostname the request arrives on —
# but it does remove a second, unnecessary public entry point to the same
# Worker once you have a real domain. Safe to flip back to `true` (or delete
# the line) for a fork that hasn't set up a custom domain yet.
workers_dev = false
preview_urls = true

[vars]
SUMMARY_MODEL = "claude-haiku-4-5-20251001"
DAILY_SUMMARY_LIMIT = 80
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
TURNSTILE_SITE_KEY = "0x4AAAAAAD5FSIrh2Xu_PuNh"
PUBLIC_BASE_URL = "https://clipfeed.iuma.dev"
# Shown as a GitHub icon link in the header and the footer's license link
# (see GET /api/config, Header.tsx, Footer.tsx) — [vars] default "" (per the
# forkability policy, never an owner-specific default), so both links are
# simply hidden until you set this to your own fork's repo URL.
REPO_URL = "https://github.com/iumalabs/clipfeed"
# Task 41 Part C: the task spec asked for 10 -> 6, but the recomputed worst
# case (SUMMARIZE_CALL_TIMEOUT_MS x2 + JUDGE_CALL_TIMEOUT_MS x2 + fetch/embed/
# image/extract overhead ~= 357s) leaves 6 minutes (360s) only ~3s of
# margin -- not enough to avoid killing genuinely-still-working live jobs.
# Set to 8 instead; see CLAUDE.md/PR description for the full arithmetic.
PENDING_TIMEOUT_MIN = 8
# Task 65: worst-case per-message pipeline duration (SUMMARIZE_CALL_TIMEOUT_MS
# x2 + JUDGE_CALL_TIMEOUT_MS x2 + overhead ~= 357s, see PENDING_TIMEOUT_MIN's
# own comment above) times ceil(AGENT_DAILY_PICKS / max_concurrency) gives the
# worst-case time for a same-day agent burst to fully drain through the
# clipfeed-jobs consumer (max_concurrency = 3 below): at the old
# AGENT_DAILY_PICKS default of 10 that's ceil(10/3) x 357s ~= 24 min, already
# uncomfortably close to the old 30-minute default here; raising
# AGENT_DAILY_PICKS to 20 pushed the same math to ceil(20/3) x 357s ~= 42 min
# -- past the old timeout, so tail messages in a big burst were being marked
# 'queue: never picked up' while genuinely still waiting behind backpressure,
# not actually lost. Doubled to keep pace, landing back at a similar ~40%
# margin over the recomputed worst case.
QUEUE_WAIT_TIMEOUT_MIN = 60
INTEREST_TOPICS = "AI/LLMs and their engineering; computer hardware — CPUs, GPUs, NVIDIA/Intel/AMD, chips; Linux — kernel, distributions, open source ecosystem; software development and programming languages; Cloudflare and edge computing; security — vulnerabilities, breaches, exploits, threat research; notable science/tech news"
AGENT_HOUR_UTC = "5"
# Curated variety (Task 33, README "Curated variety"): topic quotas,
# priority sources and the manual blocklist live in committed JSON files
# (packages/api/curation.json, packages/api/blocklist.json) — no vars
# needed for those. These two tune ONLY the KV-based auto-learned block
# mechanism (autoblock.ts), which supersedes the older thin-host-learning.ts
# counter. Strings, parsed defensively — see autoblock.ts.
AUTOBLOCK_THRESHOLD = "3"
AUTOBLOCK_TTL_DAYS = "60"
# Telegram drip publishing (see README "Telegram bot" — replaces the old
# once-daily digest with one standalone post per hour). TELEGRAM_CHANNEL_ID
# empty means posts go to the owner's own DM (TELEGRAM_OWNER_CHAT_ID)
# instead of a channel — set it (e.g. "@your_channel" or "-100...") once
# you've created a channel and added the bot as admin. PUBLISH_START_HOUR_UTC/
# PUBLISH_END_HOUR_UTC bound the daily publish window (UTC); PUBLISH_ENABLED
# is the on/off switch (only the literal "false" disables it). The drip only
# ever selects the current UTC day's articles (Task 37) — PUBLISH_MAX_PER_DAY
# caps how many of those are actually sent per UTC day, as a flood guard
# against the scraping agent producing more than one batch in a day.
TELEGRAM_CHANNEL_ID = "@clipfeedchannel"
# Task 56: the public https://t.me/<name> link for HUMANS to subscribe —
# distinct from TELEGRAM_CHANNEL_ID above, which is the internal id the
# publisher POSTs to and is never itself a clickable/shareable URL. Powers
# the "Subscribe on Telegram" banner (GET /api/config, Sidebar.tsx,
# FilterSheet.tsx) — [vars] default "" (per the forkability policy), and
# only a well-formed https://t.me/ URL renders the banner at all, so an
# unset or malformed value just hides it everywhere.
TELEGRAM_CHANNEL_URL = "https://t.me/clipfeedchannel"
PUBLISH_START_HOUR_UTC = "4"
PUBLISH_END_HOUR_UTC = "18"
PUBLISH_ENABLED = "true"
PUBLISH_MAX_PER_DAY = "10"
# How many candidates the agent saves per run. String, parsed defensively
# (1-20, else this default with a warning) — see README "Daily scraping
# agent".
AGENT_DAILY_PICKS = "20"
# How much summary you want to read: the target TOTAL body length in
# characters (all paragraphs, per language). Prompt and validation both
# derive their numbers from this one setting (see summarize.ts's
# deriveSummarySpec) — string, not a number, so a bad override (missing,
# non-numeric, outside [400, 4000]) degrades to the 800 default instead of
# breaking. See README "Summary length".
SUMMARY_BODY_TARGET_CHARS = "800"

# Task 58: below this many extracted chars, the pipeline refuses to
# summarize (fails fast with "extraction: insufficient text (N chars)"
# instead of feeding an LLM nothing to work with — see pipeline.ts). String,
# not a number, so a bad override (missing, non-numeric, outside
# [100, 2000]) degrades to the 300 default. 300 is not a guess: a 100-article
# sample of this instance's real stored full_text lengths found zero below
# it, and the single shortest real article (330 chars) was a legitimate,
# fully-extracted short-form quote.
MIN_EXTRACTED_CHARS = "300"

# Faithfulness check (see packages/api/src/pipeline/faithfulness.ts, README
# "Faithfulness check"): a SEPARATE judge pass, always Workers AI Llama
# regardless of which model wrote the summary, that verifies a summary
# against its source after it validates but before the article is marked
# ready. FAITHFULNESS_CHECK enabled by default (only the literal "false"
# disables it). FAITHFULNESS_ENFORCE also enabled by default (only the
# literal "false" disables it, back to the old signal-only behavior) — Task
# 42: the badge is no longer reader-facing (owner mode only), and a 'fail'
# verdict now drives one single automatic remediation attempt instead of
# staying purely observational: a deterministic no-LLM bullet-drop repair
# when every unsupported/contradicted claim maps to a bullet, otherwise one
# informed resummarize-and-reverify. Whatever that single attempt produces,
# an agent-picked article that's still 'fail' auto-archives (the reader
# never sees it); an owner-added article always stays visible regardless of
# verdict (the owner decides). Never runs a second time on the same
# article, even across a later resummarize or heal cycle.
FAITHFULNESS_CHECK = "true"
FAITHFULNESS_ENFORCE = "true"
FAITHFULNESS_JUDGE_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Embeddings — semantic dedup (agent-pool.ts) + semantic search
# (GET /api/search, README "Semantic dedup & search"). bge-m3: Workers AI's
# multilingual embedding model (100+ languages, including our ru/en
# summaries), 1024 dimensions, cosine metric — matches the Vectorize index
# below exactly (see embeddings.ts's dimension-mismatch guard). Threshold
# and candidate cap were tuned against real production data — see README
# for the derivation and the honest "best-effort" caveat.
EMBEDDING_MODEL = "@cf/baai/bge-m3"
SEMANTIC_DEDUP_MAX_CANDIDATES = "40"
SEMANTIC_DEDUP_THRESHOLD = "0.82"
SEARCH_RATE_PER_MIN = "30"
SEARCH_MIN_SCORE = "0.5"

# Article images (Task 35, README "Article images"): downloads each
# article's og:image/twitter:image (if any) through the SSRF-safe fetch
# guard and stores it in R2 (see the [[r2_buckets]] binding below), served
# publicly at GET /img/:id. IMAGES_ENABLED enabled by default — only the
# literal "false" disables the whole feature (no extraction, no download, no
# R2 write); the IMAGES binding being absent (fork hasn't run
# `deno task setup` yet) already degrades the same way on its own.
IMAGES_ENABLED = "true"

# robots.txt compliance (Task 48, README "robots.txt & bot transparency",
# see packages/api/src/pipeline/robots.ts): before any server-side article
# fetch, the target host's robots.txt is loaded (KV-cached 24h) and
# evaluated against the generic `User-agent: *` group — this fetcher never
# declares a distinct bot identity (see README for why). Agent-picked
# candidates that are disallowed are dropped before ranking (no LLM spend);
# a manually- or Telegram-added URL that's disallowed gets a 409 instead,
# with an explicit owner override (?force=1 / "force" in the Telegram
# message). The browser-extension path is unaffected — it supplies
# pre-extracted HTML and never triggers a fetch. ROBOTS_RESPECT enabled by
# default — only the literal "false" disables the whole feature.
ROBOTS_RESPECT = "true"
# Contact address shown on the public GET /bot transparency page for
# removal requests — [vars] default "" (per the forkability policy, never
# an owner-specific default, same as REPO_URL above); the contact section
# is omitted from the page entirely while this is unset.
CONTACT_EMAIL = ""

[ai]
binding = "AI"

# Provisioned by `deno task setup` (or `wrangler vectorize create
# clipfeed-embeddings --dimensions=1024 --metric=cosine`) — optional at
# runtime: a fork that hasn't run setup yet simply has no VECTORS binding,
# and every call site degrades gracefully (semantic dedup skips its layer,
# search falls back to the existing LIKE query) rather than crashing. See
# embeddings.ts.
[[vectorize]]
binding = "VECTORS"
index_name = "clipfeed-embeddings"

# Provisioned by `deno task setup` (or `wrangler r2 bucket create
# clipfeed-images`) — optional article-thumbnail storage (Task 35, README
# "Article images"). Same graceful-degradation story as Vectorize above: no
# IMAGES binding simply means downloadAndStoreImage (images.ts) skips
# storing an image, the pipeline proceeds unchanged with no image on the
# article.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "clipfeed-images"

# Single hourly cron (see packages/api/src/scheduled/scheduled.ts):
#   - AGENT_HOUR_UTC (default 5, empty/invalid disables it): the scraping
#     agent (see README "Daily scraping agent"), runs once at this hour.
#   - The Telegram drip publish job (see README "Telegram bot") runs on
#     EVERY tick, gated by its own PUBLISH_START_HOUR_UTC/
#     PUBLISH_END_HOUR_UTC window + PUBLISH_ENABLED above rather than a
#     single dispatch hour — it publishes at most one article per tick,
#     across the whole window, replacing the old once-daily digest cron.
# Always UTC, unaffected by your own timezone.
[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./dist/web"
binding = "ASSETS"
# Task 60: any path the asset handler can't match to a real file (e.g. "/a/"
# with no id, or any other unrecognized route) serves the SPA shell
# (index.html) instead of a raw platform 404 — the SPA itself then renders
# its own styled not-found view for a path it doesn't recognize (see
# lib/feed/deepLink.ts's isUnknownPath and components/NotFound.tsx).
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "clipfeed"
database_id = "44591469-9b64-48e4-8799-0330f5f8382e"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "8e4fddfbda204322a609830cc771124f"

# Article pipeline execution (fetch -> extract -> summarize -> persist) runs
# in the queue consumer below, not in the request handler's ctx.waitUntil()
# — that has a hard 30-second cap after the response is sent, and large
# articles' Workers AI summarization calls have been measured well past
# that (see README "Queue-based pipeline execution"). A consumer invocation
# gets minutes of wall time instead. max_batch_size = 1 keeps one article
# per invocation, so one slow summarization never blocks another queued
# article's budget.
#
# dead_letter_queue = "clipfeed-dlq": the pipeline itself guarantees a
# terminal 'ready'/'failed' row ONLY once the consumer actually runs it
# (see pipeline.ts) — a message that's silently dropped before that ever
# happens (delivery never reaching a consumer invocation, or an infra-level
# failure exhausting max_retries) previously left the article stuck
# 'pending' until the sweeper's timeout, with no record of what happened.
# The DLQ consumer below (same Worker, see index.ts's `queue` export)
# closes that gap: it terminal-fails the referenced article directly, so no
# queue path can leave a row non-terminal regardless of the failure
# mechanism.
#
# Neither queue is provisioned by this config — a forker runs
# `deno task setup` once (or `wrangler queues create clipfeed-jobs` +
# `wrangler queues create clipfeed-dlq`) before their first deploy. If the
# JOBS binding isn't available (queue missing, or any environment that
# hasn't set this up), the app falls back to the pre-Queues
# ctx.waitUntil() behavior — see queue.ts's enqueueArticleJob.
[[queues.producers]]
binding = "JOBS"
queue = "clipfeed-jobs"

# max_concurrency = 3 (added after a burst investigation — see README
# "Queue-based pipeline execution"/CLAUDE.md task history): the daily agent
# job enqueues up to AGENT_DAILY_PICKS messages in a tight loop, all landing
# in the queue within milliseconds of each other. Left unset, Cloudflare
# auto-scales how many consumer invocations run concurrently to drain a
# sudden backlog, and a live burst of 10 showed at least two messages only
# succeeding on their second delivery attempt — consistent with (though not
# conclusively proven to be caused by) invocation contention under a sudden
# spike of concurrent consumer invocations. Capping concurrency is a cheap,
# reversible, latency-insensitive mitigation for a background job either
# way; the existing terminal-state guarantee + DLQ consumer + healing sweep
# already fully bound the downside even if this isn't the actual cause.
[[queues.consumers]]
queue = "clipfeed-jobs"
max_batch_size = 1
max_retries = 2
max_batch_timeout = 5
max_concurrency = 3
dead_letter_queue = "clipfeed-dlq"

[[queues.consumers]]
queue = "clipfeed-dlq"
max_batch_size = 10
max_retries = 3

# invocation_logs writes one line per request; lower head_sampling_rate if
# public traffic grows.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
