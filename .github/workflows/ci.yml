name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Feeds the e2e job's `if:` below — computes whether this push/PR touches
  # anything the Playwright suite actually exercises (see scripts/e2e/run.ts:
  # it boots the built api+web Worker against wrangler.toml/migrations, so
  # "affects e2e" is effectively "affects the deployed app", not just e2e/
  # itself). packages/extension is deliberately excluded — e2e never touches
  # the Chrome extension (see e2e/tests/, none of it references extension
  # code; that surface has its own release-extension.yml flow).
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - 'e2e/**'
              - 'packages/api/**'
              - 'packages/web/**'
              - 'packages/shared/**'
              - 'migrations/**'
              - 'scripts/build.ts'
              - 'scripts/e2e/**'
              - 'wrangler.toml'
              - 'deno.json'
              - 'deno.lock'

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.1"

      # Task 41 Part E: caps resident memory for fmt/lint so a future huge
      # vendored asset (accidentally outside deno.json's exclude patterns)
      # can't OOM the runner. `ulimit -v` doesn't work here -- V8 reserves a
      # large virtual address space on startup regardless of actual usage,
      # so it kills `deno` immediately rather than only under real memory
      # pressure. The wrapper script polls actual RSS instead; see its
      # header comment for the local repro that proved a ~500MB-plus valid
      # JS file drives deno fmt's peak RSS into double-digit GB.
      - name: Format check
        run: ./scripts/ci/run-with-memory-limit.sh 512 -- deno fmt --check

      - name: Lint
        run: ./scripts/ci/run-with-memory-limit.sh 512 -- deno lint

      - name: Test
        run: deno task test

      # Blocking, but at a deliberately realistic bar (85%, not 100%) —
      # baseline at the time this was added was ~91% line / ~94% branch /
      # ~94% function (see `deno task coverage` locally for the live
      # per-file breakdown). Excludes _test.ts files themselves, testing/
      # (fakes/test-only infra), vendor/ (self-hosted Swagger UI, never
      # exercised by deno test), and scripts/ (dev/deploy tooling that
      # mostly just wraps real `wrangler` subprocess calls — not
      # meaningfully unit-testable without a live Cloudflare account, and
      # not part of the deployed app). This is a floor against regression,
      # not a mandate to chase literal 100% — see deno.json's coverage:check
      # task for the exact command this runs.
      - name: Coverage threshold
        run: deno task coverage:check

      - name: Build
        run: deno task build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action (the official wrapper) requires a paid
      # GITLEAKS_LICENSE for any organization-owned repo — it started
      # failing outright once this repo moved to the iumalabs org. Running
      # the open-source gitleaks CLI directly (its own Docker image) has no
      # such license gate in any context, and keeps this forkable per
      # CLAUDE.md without asking every fork to register for a key. Same
      # scan target as before: the full history of whatever ref is checked
      # out (fetch-depth: 0 above), matching CLAUDE.md's "git-tracked
      # content and git history" scope.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source . -v --redact

  # Task 50: Playwright E2E suite (see e2e/, scripts/e2e/run.ts) — deliberately
  # ADVISORY (job-level continue-on-error), not blocking, unlike `check`
  # above. Reasoning: browser E2E carries materially more infra-flake risk
  # (timing, runner resource contention, a first-time browser download) than
  # the existing fast Deno unit/integration suite, and the class of bug this
  # guards against (Tasks 40/49 — browser-integration regressions unit tests
  # can't see) is exactly caught structurally and DETERMINISTICALLY by the
  # Part C contract tests instead, which already run in the blocking `check`
  # job above via the ordinary `deno task test` (no separate wiring needed —
  # they're plain Deno tests). This is marked advisory-with-visible-status: a
  # relevant run still appears on the PR (so a real regression is never
  # silent), it just can't block the merge on its own — revisit this once the
  # suite has a track record of not flaking in this CI environment.
  #
  # Also gated on the `changes` job above: skipped entirely (not just
  # advisory) when nothing e2e-relevant changed — a README/docs-only PR
  # shouldn't pay for a Chromium download and a full app boot just to run a
  # suite that couldn't have caught anything in that diff.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.1"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright + Chromium
        run: |
          npm --prefix e2e ci
          npx --prefix e2e playwright install --with-deps chromium

      - name: Run E2E suite
        run: deno task e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
